name: SecureOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: sqlite:///secureops-test.db
      SECUREOPS_ADMIN_USER: test-admin
      SECUREOPS_ADMIN_PASSWORD: TestPassword123!
      RATELIMIT_STORAGE_URI: memory://

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest

      - name: Run static security analysis
        run: bandit -r app

      - name: Run dependency vulnerability scan
        run: pip-audit

  deploy:
    name: Deploy to OCI
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/secureops_deploy
          chmod 600 ~/.ssh/secureops_deploy

          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy SecureOps
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh \
            -i ~/.ssh/secureops_deploy \
            -o IdentitiesOnly=yes \
            "$OCI_USER@$OCI_HOST" << 'EOF'
              set -euo pipefail

              cd /opt/secureops

              git fetch origin main
              git checkout main
              git pull --ff-only origin main

              /opt/secureops/.venv/bin/python -m pip install \
                -r /opt/secureops/requirements.txt

              sudo systemctl restart secureops
              sudo systemctl is-active --quiet secureops

              curl \
                --fail \
                --silent \
                --show-error \
                --head \
                http://127.0.0.1:8000/login
          EOF

      - name: Verify public HTTPS
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --head \
            --retry 5 \
            --retry-delay 3 \
            https://secureops.leonardooliveira.dev/login

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/secureops_deploy